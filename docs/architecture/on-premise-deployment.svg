<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="'72', '72full', 'Helvetica Neue', Arial, sans-serif"><title>OData MCP Proxy — self-hosted (on-premise)</title><defs><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475E75"/></marker><marker id="arrs-data" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#475E75"/></marker><marker id="arr-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5D36FF"/></marker><marker id="arrs-auth" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#5D36FF"/></marker></defs><rect width="1500" height="900" fill="#FFFFFF"/><text x="30" y="44" font-size="22" font-weight="700" fill="#1D2D3E">OData MCP Proxy — self-hosted (on-premise)</text><text x="30" y="68" font-size="13" fill="#556B82">Node.js server in the customer network, SSO via any OpenID Connect provider, user propagated to SAP</text><rect x="30" y="110" width="250" height="230" rx="12" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="46" y="139" font-size="15" font-weight="700" fill="#1D2D3E">AI clients</text><rect x="50" y="160" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(62,172)"><circle cx="14" cy="10" r="5" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M4 25 C4 17 24 17 24 25" fill="none" stroke="#475E75" stroke-width="1.8"/></g><text x="100" y="191" font-size="14" font-weight="700" fill="#1D2D3E">MCP client</text><text x="64" y="218" font-size="12" fill="#556B82">Claude, Copilot Studio,</text><text x="64" y="236" font-size="12" fill="#556B82">MCP Inspector, …</text><text x="64" y="254" font-size="12" fill="#556B82">Streamable HTTP + OAuth</text><rect x="30" y="540" width="250" height="190" rx="12" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="46" y="569" font-size="15" font-weight="700" fill="#1D2D3E">OpenID Connect provider</text><rect x="50" y="590" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(62,602)"><rect x="3" y="6" width="22" height="16" rx="3" fill="none" stroke="#475E75" stroke-width="1.8"/><circle cx="10" cy="13" r="3" fill="none" stroke="#475E75" stroke-width="1.6"/><path d="M15 12 H22 M15 16 H20" stroke="#475E75" stroke-width="1.6"/></g><text x="100" y="621" font-size="14" font-weight="700" fill="#1D2D3E">Any OIDC IdP</text><text x="64" y="648" font-size="12" fill="#556B82">Entra ID, Okta, Keycloak,</text><text x="64" y="666" font-size="12" fill="#556B82">SAP IAS, Auth0, …</text><rect x="320" y="90" width="800" height="650" rx="12" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="336" y="119" font-size="15" font-weight="700" fill="#1D2D3E">Customer data center / private network</text><rect x="350" y="180" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(362,192)"><path d="M3 9 H19 M15 5 L19 9 L15 13 M25 19 H9 M13 15 L9 19 L13 23" fill="none" stroke="#475E75" stroke-width="1.8"/></g><text x="400" y="211" font-size="14" font-weight="700" fill="#1D2D3E">Reverse proxy</text><text x="364" y="238" font-size="12" fill="#556B82">HTTPS / TLS termination</text><text x="364" y="256" font-size="12" fill="#556B82">nginx, IIS, Caddy, …</text><rect x="600" y="165" width="260" height="225" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(612,177)"><rect x="3" y="4" width="22" height="20" rx="3" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M3 10 H25" stroke="#475E75" stroke-width="1.8"/><path d="M9 15 L7 17 L9 19 M19 15 L21 17 L19 19" fill="none" stroke="#475E75" stroke-width="1.6"/></g><text x="650" y="196" font-size="14" font-weight="700" fill="#1D2D3E">odata-mcp-proxy</text><text x="614" y="223" font-size="12" fill="#556B82">Node.js server (systemd, Docker)</text><text x="614" y="241" font-size="12" fill="#556B82">/mcp  Streamable HTTP</text><text x="614" y="259" font-size="12" fill="#556B82">/oauth/*  OAuth proxy</text><text x="614" y="277" font-size="12" fill="#556B82">OIDC JWT validation (JWKS)</text><text x="614" y="295" font-size="12" fill="#556B82">Per-user token cache</text><text x="614" y="313" font-size="12" fill="#556B82">SAML assertion signing</text><rect x="600" y="445" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(612,457)"><circle cx="9" cy="14" r="5" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M14 14 H25 M21 14 V19 M25 14 V18" stroke="#475E75" stroke-width="1.8"/></g><text x="650" y="476" font-size="14" font-weight="700" fill="#1D2D3E">Secret store</text><text x="614" y="503" font-size="12" fill="#556B82">SAML signing key,</text><text x="614" y="521" font-size="12" fill="#556B82">client secrets</text><rect x="890" y="455" width="205" height="160" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(902,467)"><ellipse cx="14" cy="7" rx="10" ry="3.5" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M4 7 V21 C4 23 9 24.5 14 24.5 C19 24.5 24 23 24 21 V7" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M4 14 C4 16 9 17.5 14 17.5 C19 17.5 24 16 24 14" fill="none" stroke="#475E75" stroke-width="1.6"/></g><text x="940" y="486" font-size="14" font-weight="700" fill="#1D2D3E">SAP S/4HANA / ABAP</text><text x="904" y="513" font-size="12" fill="#556B82">OAuth 2.0 server (SOAUTH2)</text><text x="904" y="531" font-size="12" fill="#556B82">SAML2 trusted provider</text><text x="904" y="549" font-size="12" fill="#556B82">OData services</text><text x="904" y="567" font-size="12" fill="#556B82">Runs as the business user</text><rect x="1150" y="110" width="330" height="440" rx="12" fill="#EBF8FF" stroke="#0070F2" stroke-width="1.5"/><g transform="translate(1166,124)"><path d="M0 0 H44 L30 20 H0 Z" fill="#0070F2"/><text x="5" y="14.5" font-size="11" font-weight="700" fill="#fff">SAP</text></g><text x="1220" y="139" font-size="15" font-weight="700" fill="#1D2D3E">SAP BTP</text><rect x="1168" y="150" width="294" height="380" rx="12" fill="#FFFFFF" stroke="#0070F2" stroke-width="1" stroke-dasharray="6 4"/><text x="1184" y="179" font-size="13" font-weight="700" fill="#0070F2">Integration subaccount</text><rect x="1185" y="192" width="262" height="75" rx="8" fill="#FFFFFF" stroke="#0070F2" stroke-width="1"/><g transform="translate(1197,204)"><path d="M14 3 L24 7 V14 C24 20 19 24 14 26 C9 24 4 20 4 14 V7 Z" fill="none" stroke="#0070F2" stroke-width="1.8"/><path d="M9.5 14.5 L13 18 L19 11" fill="none" stroke="#0070F2" stroke-width="1.8"/></g><text x="1235" y="223" font-size="14" font-weight="700" fill="#1D2D3E">Authorization &amp; Trust Mgmt</text><text x="1199" y="250" font-size="12" fill="#556B82">XSUAA token endpoint</text><rect x="1185" y="290" width="262" height="75" rx="8" fill="#FFFFFF" stroke="#0070F2" stroke-width="1"/><g transform="translate(1197,302)"><path d="M8 6 C4 6 5 14 2 14 C5 14 4 22 8 22 M20 6 C24 6 23 14 26 14 C23 14 24 22 20 22" fill="none" stroke="#0070F2" stroke-width="1.8"/><circle cx="11" cy="14" r="1.6" fill="#0070F2"/><circle cx="17" cy="14" r="1.6" fill="#0070F2"/></g><text x="1235" y="321" font-size="14" font-weight="700" fill="#1D2D3E">SAP Integration Suite</text><text x="1199" y="348" font-size="12" fill="#556B82">Cloud Integration OData API</text><rect x="1185" y="398" width="262" height="75" rx="8" fill="#FFFFFF" stroke="#0070F2" stroke-width="1"/><g transform="translate(1197,410)"><path d="M8 6 C4 6 5 14 2 14 C5 14 4 22 8 22 M20 6 C24 6 23 14 26 14 C23 14 24 22 20 22" fill="none" stroke="#0070F2" stroke-width="1.8"/><circle cx="11" cy="14" r="1.6" fill="#0070F2"/><circle cx="17" cy="14" r="1.6" fill="#0070F2"/></g><text x="1235" y="429" font-size="14" font-weight="700" fill="#1D2D3E">SAP BTP Core Services APIs</text><text x="1199" y="456" font-size="12" fill="#556B82">Accounts, entitlements, …</text><path d="M260 235 L350 235" fill="none" stroke="#475E75" stroke-width="1.6" marker-end="url(#arr-data)"/><path d="M550 235 L600 235" fill="none" stroke="#475E75" stroke-width="1.6" marker-end="url(#arr-data)"/><circle cx="305" cy="235" r="11" fill="#1D2D3E"/><text x="305" y="239.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M600 360 L575 360 L575 645 L260 645" fill="none" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr-auth)"/><circle cx="575" cy="500" r="11" fill="#1D2D3E"/><text x="575" y="504.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="420" y="633" font-size="11.5" fill="#556B82" text-anchor="middle">OIDC login (proxied) · JWKS</text><path d="M700 390 L700 445" fill="none" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr-auth)" marker-start="url(#arrs-auth)"/><path d="M820 390 L820 500 L890 500" fill="none" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr-auth)"/><circle cx="820" cy="440" r="11" fill="#1D2D3E"/><text x="820" y="444.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M845 390 L845 575 L890 575" fill="none" stroke="#475E75" stroke-width="1.6" marker-end="url(#arr-data)"/><circle cx="845" cy="530" r="11" fill="#1D2D3E"/><text x="845" y="534.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M860 215 L1185 215" fill="none" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr-auth)"/><path d="M860 325 L1185 325" fill="none" stroke="#475E75" stroke-width="1.6" marker-end="url(#arr-data)"/><path d="M1135 325 L1135 435 L1185 435" fill="none" stroke="#475E75" stroke-width="1.6" marker-end="url(#arr-data)"/><circle cx="1010" cy="215" r="11" fill="#1D2D3E"/><text x="1010" y="219.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="1010" cy="325" r="11" fill="#1D2D3E"/><text x="1010" y="329.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1010" y="200" font-size="11.5" fill="#556B82" text-anchor="middle">client credentials · jwt-bearer · token exchange</text><text x="1000" y="345" font-size="11.5" fill="#556B82" text-anchor="middle">OData / REST calls</text><line x1="30" y1="770" x2="1470" y2="770" stroke="#D5DADD"/><text x="30" y="800" font-size="13" font-weight="700" fill="#1D2D3E">Legend</text><rect x="30" y="811" width="30" height="16" rx="4" fill="#EBF8FF" stroke="#0070F2" stroke-width="1.5"/><text x="70" y="823" font-size="12" fill="#1D2D3E">SAP BTP</text><rect x="30" y="835" width="30" height="16" rx="4" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="70" y="847" font-size="12" fill="#1D2D3E">Non-SAP / customer</text><line x1="30" y1="867" x2="60" y2="867" stroke="#475E75" stroke-width="1.6"/><text x="70" y="871" font-size="12" fill="#1D2D3E">API call / data flow</text><line x1="30" y1="891" x2="60" y2="891" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="895" font-size="12" fill="#1D2D3E">Authentication / token flow</text><text x="290" y="800" font-size="13" font-weight="700" fill="#1D2D3E">Flow</text><circle cx="301" cy="818" r="11" fill="#1D2D3E"/><text x="301" y="822.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="320" y="823" font-size="12" fill="#1D2D3E">MCP client calls /mcp over HTTPS with a bearer token from the corporate IdP</text><circle cx="301" cy="842" r="11" fill="#1D2D3E"/><text x="301" y="846.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="320" y="847" font-size="12" fill="#1D2D3E">Login is proxied to the OIDC provider; tokens are validated against its JWKS</text><circle cx="301" cy="866" r="11" fill="#1D2D3E"/><text x="301" y="870.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="320" y="871" font-size="12" fill="#1D2D3E">saml-bearer: proxy signs a SAML assertion for the user, SAP returns a user token</text><circle cx="891" cy="818" r="11" fill="#1D2D3E"/><text x="891" y="822.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="910" y="823" font-size="12" fill="#1D2D3E">OData request to S/4HANA / ABAP runs as the signed-in business user</text><circle cx="891" cy="842" r="11" fill="#1D2D3E"/><text x="891" y="846.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="910" y="847" font-size="12" fill="#1D2D3E">BTP targets: token from XSUAA (technical user, jwt-bearer or token exchange)</text><circle cx="891" cy="866" r="11" fill="#1D2D3E"/><text x="891" y="870.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="910" y="871" font-size="12" fill="#1D2D3E">Cloud Integration and BTP APIs are called directly over the internet</text></svg>
