<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="'72', '72full', 'Helvetica Neue', Arial, sans-serif"><title>OData MCP Proxy — deployed on SAP BTP</title><defs><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475E75"/></marker><marker id="arrs-data" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#475E75"/></marker><marker id="arr-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5D36FF"/></marker><marker id="arrs-auth" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#5D36FF"/></marker></defs><rect width="1500" height="960" fill="#FFFFFF"/><text x="30" y="44" font-size="22" font-weight="700" fill="#1D2D3E">OData MCP Proxy — deployed on SAP BTP</text><text x="30" y="68" font-size="13" fill="#556B82">Cloud Foundry app with XSUAA login, Destination Service and Cloud Connector for on-premise systems</text><rect x="30" y="110" width="250" height="230" rx="12" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="46" y="139" font-size="15" font-weight="700" fill="#1D2D3E">AI clients</text><rect x="50" y="160" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#475E75" stroke-width="1"/><g transform="translate(62,172)"><circle cx="14" cy="10" r="5" fill="none" stroke="#475E75" stroke-width="1.8"/><path d="M4 25 C4 17 24 17 24 25" fill="none" stroke="#475E75" stroke-width="1.8"/></g><text x="100" y="191" font-size="14" font-weight="700" fill="#1D2D3E">MCP client</text><text x="64" y="218" font-size="12" fill="#556B82">Claude, Copilot Studio,</text><text x="64" y="236" font-size="12" fill="#556B82">MCP Inspector, …</text><text x="64" y="254" font-size="12" fill="#556B82">Streamable HTTP + OAuth</text>