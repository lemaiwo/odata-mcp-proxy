="#556B82" text-anchor="start">RFC / HTTP</text><line x1="30" y1="815" x2="1470" y2="815" stroke="#D5DADD"/><text x="30" y="845" font-size="13" font-weight="700" fill="#1D2D3E">Legend</text><rect x="30" y="856" width="30" height="16" rx="4" fill="#EBF8FF" stroke="#0070F2" stroke-width="1.5"/><text x="70" y="868" font-size="12" fill="#1D2D3E">SAP BTP</text><rect x="30" y="880" width="30" height="16" rx="4" fill="#F5F6F7" stroke="#475E75" stroke-width="1.5"/><text x="70" y="892" font-size="12" fill="#1D2D3E">Non-SAP / customer</text><line x1="30" y1="912" x2="60" y2="912" stroke="#475E75" stroke-width="1.6"/><text x="70" y="916" font-size="12" fill="#1D2D3E">API call / data flow</text><line x1="30" y1="936" x2="60" y2="936" stroke="#5D36FF" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="940" font-size="12" fill="#1D2D3E">Authentication / token flow</text><text x="290" y="845" font-size="13" font-weight="700" fill="#1D2D3E">Flow</text><circle cx="301" cy="863" r="11" fill="#1D2D3E"/><text x="301" y="867.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="320" y="868" font-size="12" fill="#1D2D3E">MCP client calls /mcp with an XSUAA bearer token (Streamable HTTP)</text><circle cx="301" cy="887" r="11" fill="#1D2D3E"/><text x="301" y="891.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="320" y="892" font-size="12" fill="#1D2D3E">Login is proxied to XSUAA → IAS → corporate IdP; tokens validated by XSUAA</text><circle cx="301" cy="911" r="11" fill="#1D2D3E"/><text x="301" y="915.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="320" y="916" font-size="12" fill="#1D2D3E">SAP Cloud SDK resolves the destination, exchanging the user token if configured</text><circle cx="891" cy="863" r="11" fill="#1D2D3E"/><text x="891" y="867.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="910" y="868" font-size="12" fill="#1D2D3E">Cloud 